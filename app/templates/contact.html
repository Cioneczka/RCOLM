
{% extends "base.html" %}
{% block title %}Contact | RCOLM{% endblock %}

{% block content %}
<main class="max-w-screen-xl mx-auto px-4 pt-24 pb-16 space-y-10">

  <h1 class="text-3xl font-bold text-white mb-3">Contact</h1>
  <p class="text-gray-400 max-w-2xl">
    Masz pytania dotyczące projektu, chcesz zgłosić błąd lub zaproponować ulepszenie?
    Skontaktuj się poprzez formularz poniżej.
  </p>

  <div class="bg-gray-800 border border-gray-700 rounded-xl p-6 max-w-2xl">
    <form class="space-y-4">

      <div>
        <label class="block text-gray-300 mb-1">Email</label>
        <input type="email"
               class="w-full p-2 rounded-lg bg-gray-900 border border-gray-700 text-gray-200"
               placeholder="you@example.com">
      </div>

      <div>
        <label class="block text-gray-300 mb-1">Message</label>
        <textarea rows="6"
                  class="w-full p-2 rounded-lg bg-gray-900 border border-gray-700 text-gray-200"
                  placeholder="Your message..."></textarea>
      </div>

      <button type="submit"
              class="px-5 py-2.5 rounded-lg bg-blue-600 text-white hover:bg-blue-500">
        Send message
      </button>
    </form>
  </div>

</main>
{% endblock %}
