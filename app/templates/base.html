
<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>{% block title %}RCOLM{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Flowbite + Tailwind CDN -->
  <link
    href="https://cdn.jsdelivr.net/npm/flowbite@2.5.1/dist/flowbite.min.css"
    rel="stylesheet"
  />
  <script src="https://cdn.jsdelivr.net/npm/flowbite@2.5.1/dist/flowbite.min.js"></script>

  <!-- Twoje minimalne style (opcjonalnie puste) -->
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=dev">

  {% block head_extra %}{% endblock %}
</head>

<body class="min-h-screen flex flex-col bg-white text-gray-900 dark:bg-gray-900 dark:text-gray-100">

<!-- NAVBAR -->
<header>
  <nav class="bg-cyan-400 dark:bg-gray-800 fixed w-full z-20 top-0 left-0 border-b border-gray-300 dark:border-gray-700 shadow">
    <div class="max-w-screen-xl mx-auto p-4 flex items-center justify-between">

      <!-- LOGO -->
      <a href="/" class="flex items-center space-x-3">
        <img src="{{ url_for('static', filename='img/RCOLM_logo.png') }}" class="h-9" alt="RCOLM logo">
        <span class="text-xl font-semibold">RCOLM</span>
      </a>

      <!-- DESKTOP MENU -->
      <div class="hidden md:flex space-x-8 font-medium">
        <a href="/" class="text-gray-900 dark:text-white hover:text-blue-700">Home</a>
        <a href="/about" class="text-gray-900 dark:text-gray-300 hover:text-blue-700">About</a>
        <a href="/contact" class="text-gray-900 dark:text-gray-300 hover:text-blue-700">Contact</a>
      </div>

      <!-- MOBILE MENU BUTTON -->
      <button data-collapse-toggle="mobile-nav"
              type="button"
              class="md:hidden p-2 text-gray-700 dark:text-gray-200 hover:bg-gray-200 dark:hover:bg-gray-700 rounded">
        <svg class="w-6 h-6" fill="none" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
      </button>
    </div>

    <!-- MOBILE NAV -->
     <div id="mobile-nav" class="hidden md:hidden bg-cyan-300 dark:bg-gray-700">
       <ul class="flex flex-col p-4 space-y-2 font-medium">
         <li><a href="/" class="block py-2 px-3 hover:bg-cyan-200 dark:hover:bg-gray-600">Home</a></li>
         <li><a href="/about" class="block py-2 px-3 hover:bg-cyan-200 dark:hover:bg-gray-600">About</a></li>
         <li><a href="/contact" class="block py-2 px-3 hover:bg-cyan-200 dark:hover:bg-gray-600">Contact</a></li>
       </ul>
     </div>
  </nav>
</header>

<!-- MAIN CONTENT -->
<main class="flex-1 pt-24 pb-16 max-w-screen-xl mx-auto px-4">
  {% block content %}{% endblock %}
</main>

<!-- FOOTER -->
<footer class="w-full p-4 bg-gray-100 dark:bg-gray-800 border-t border-gray-300 dark:border-gray-700">
  <div class="max-w-screen-xl mx-auto flex flex-col md:flex-row items-center justify-between text-sm text-gray-600 dark:text-gray-300">
    <span>© 2025 RCOLM. All rights reserved.</span>
    <ul class="flex space-x-6 mt-3 md:mt-0">
      <li><a href="/about" class="hover:underline">About</a></li>
      <li><a href="#" class="hover:underline">Licensing</a></li>
    </ul>
  </div>
</footer>

{% block scripts %}{% endblock %}
</body>
</html>
